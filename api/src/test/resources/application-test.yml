spring:
  # 테스트 환경에서는 Testcontainers가 동적으로 설정함
  data:
    redis:
      # 테스트용 더미 설정 - 실제 연결하지 않음
      host: localhost
      port: 16379  # 사용하지 않는 포트
      timeout: 100ms  # 빠른 타임아웃
      lettuce:
        shutdown-timeout: 10ms
        
  # 애플리케이션이 Redis 연결 실패에도 시작되도록 설정
  main:
    allow-bean-definition-overriding: true
    lazy-initialization: true  # 지연 초기화로 Redis 연결 오류 회피
    
  # Redis 자동 구성 비활성화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# 로깅 설정 - 테스트 시 너무 많은 로그를 방지
logging:
  level:
    com.simplechat: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.data.r2dbc: WARN
    io.r2dbc.postgresql: WARN
    io.lettuce.core: WARN
    org.springframework.data.redis: WARN
    org.springframework.data.mongodb: WARN
    org.testcontainers: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

# JWT 테스트 설정
jwt:
  secret: testSecretKeyForTestEnvironment123456789
  expiration: 60000 # 1 minute for tests
  refresh-expiration: 120000 # 2 minutes for tests
  issuer: simple-chat-server-test
  header: Authorization
  prefix: Bearer

# 테스트용 WebSocket 설정
websocket:
  endpoint: /ws
  allowed-origins: "*"  # 테스트에서는 모든 origin 허용

# 에러 설정 - 테스트에서 상세한 에러 정보 포함
server:
  error:
    include-stacktrace: always
    include-message: always