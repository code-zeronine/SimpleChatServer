<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SimpleChatServer 로그인">
    <title>로그인 - SimpleChatServer</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo">
                        <span class="logo-icon">💬</span>
                        <span class="logo-text">SimpleChatServer</span>
                    </div>
                    <h1 class="auth-title">로그인</h1>
                    <p class="auth-subtitle">계정에 로그인하여 채팅을 시작하세요</p>
                </div>

                <div class="auth-content">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="email" class="form-label">이메일</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input"
                                placeholder="example@email.com"
                                required
                            >
                            <div class="form-error" id="emailError"></div>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">비밀번호</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input"
                                placeholder="비밀번호를 입력하세요"
                                required
                            >
                            <div class="form-error" id="passwordError"></div>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="rememberMe" name="rememberMe">
                                <span class="checkbox-text">로그인 상태 유지</span>
                            </label>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-primary btn-full" id="loginButton">
                                <span class="btn-text">로그인</span>
                                <span class="btn-loading" style="display: none;">
                                    <span class="loading-spinner"></span>
                                    로그인 중...
                                </span>
                            </button>
                        </div>

                        <div class="form-error" id="formError"></div>
                        <div class="form-success" id="formSuccess"></div>
                    </form>
                </div>

                <div class="auth-footer">
                    <p class="auth-switch">
                        계정이 없으신가요? 
                        <a href="/register" class="auth-link">회원가입</a>
                    </p>
                    <p class="auth-back">
                        <a href="/" class="auth-link">← 메인으로 돌아가기</a>
                    </p>
                </div>
            </div>

            <!-- Demo 계정 정보 -->
            <div class="demo-accounts">
                <h3>테스트 계정</h3>
                <div class="demo-account" data-email="admin@simplechat.com" data-password="password123">
                    <strong>관리자 계정</strong>
                    <p>이메일: admin@simplechat.com</p>
                    <p>비밀번호: password123</p>
                    <button class="btn btn-secondary btn-small demo-login">사용하기</button>
                </div>
                <div class="demo-account" data-email="alice@example.com" data-password="password123">
                    <strong>사용자 계정</strong>
                    <p>이메일: alice@example.com</p>
                    <p>비밀번호: password123</p>
                    <button class="btn btn-secondary btn-small demo-login">사용하기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
