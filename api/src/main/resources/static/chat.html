<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SimpleChatServer 실시간 채팅">
    <title>채팅 - SimpleChatServer</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3e%3cpath fill='currentColor' d='M256 32C114.6 32 0 125.1 0 240c0 49.6 21.4 95 57 130.7C44.5 421.1 2.7 466 2.2 466.5c-2.2 2.3-2.8 5.7-1.5 8.7S4.8 480 8 480c66.3 0 116-31.8 146.3-74.9c28.8 12.1 60.9 18.9 94.7 18.9c141.4 0 256-93.1 256-208S397.4 32 256 32z'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- 채팅 헤더 -->
        <header class="header">
            <div class="container">
                <div class="header-left">
                    <button class="back-btn" id="backBtn" title="채팅방 목록으로">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h1 class="logo">
                        <i class="fas fa-comments logo-icon"></i>
                        <span class="room-name" id="roomName">채팅방</span>
                    </h1>
                </div>
                <div class="header-right">
                    <div class="room-status">
                        <span class="member-count" id="memberCount">참여자 0명</span>
                        <span class="connection-status" id="connectionStatus">연결 중...</span>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-secondary btn-small" id="roomSettingsBtn" title="채팅방 설정">
                            <i class="fas fa-cog"></i>
                        </button>
                        <button class="btn btn-secondary btn-small" id="memberListBtn" title="참여자 목록">
                            <i class="fas fa-users"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메시지 영역 -->
        <main class="chat-main">
            <div class="messages-container" id="messagesContainer">
                <div class="messages-list" id="messagesList">
                    <!-- 환영 메시지 -->
                    <div class="system-message">
                        <div class="system-message-content">
                            <span class="welcome-icon"><i class="fas fa-hand-sparkles"></i></span>
                            <p>채팅방에 오신 것을 환영합니다!</p>
                            <small>메시지를 입력하여 대화를 시작하세요.</small>
                        </div>
                    </div>

                    <!-- 로딩 인디케이터 -->
                    <div class="loading-messages" id="loadingMessages" style="display: none;">
                        <div class="loading-spinner">
                            <i class="fas fa-spinner fa-spin fa-2x"></i>
                        </div>
                        <p>이전 메시지를 불러오는 중...</p>
                    </div>

                    <!-- 메시지들이 여기에 동적으로 추가됩니다 -->
                </div>

                <!-- 스크롤 다운 버튼 -->
                <button class="scroll-down-btn" id="scrollDownBtn" style="display: none;">
                    <span class="scroll-icon"><i class="fas fa-arrow-down"></i></span>
                    <span class="unread-count" id="unreadCount">0</span>
                </button>
            </div>
        </main>

        <!-- 메시지 입력 영역 -->
        <footer class="chat-input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <!-- 파일 첨부 버튼 -->
                    <button class="attachment-btn" id="attachmentBtn" title="파일 첨부">
                        <i class="fas fa-paperclip"></i>
                    </button>

                    <!-- 메시지 입력창 -->
                    <div class="message-input-wrapper">
                        <textarea 
                            id="messageInput" 
                            class="message-input"
                            placeholder="메시지를 입력하세요..."
                            rows="1"
                            maxlength="1000"
                        ></textarea>
                        <div class="input-actions">
                            <button class="emoji-btn" id="emojiBtn" title="이모지">
                                <i class="far fa-smile"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 전송 버튼 -->
                    <button class="send-btn" id="sendBtn" title="전송" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>

                <!-- 타이핑 인디케이터 -->
                <div class="typing-indicator" id="typingIndicator" style="display: none;">
                    <div class="typing-animation">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text" id="typingText">누군가가 입력 중...</span>
                </div>

                <!-- 메시지 카운터 -->
                <div class="message-counter" id="messageCounter">
                    <span class="char-count">0</span>/1000
                </div>
            </div>
        </footer>

        <!-- 파일 첨부 모달 -->
        <div class="modal" id="attachmentModal">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>파일 첨부</h3>
                    <button class="modal-close" id="closeAttachmentModal"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <div class="file-drop-area" id="fileDropArea">
                        <div class="drop-icon"><i class="fas fa-folder-open"></i></div>
                        <p>파일을 여기로 드래그하거나 클릭하여 선택하세요</p>
                        <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.txt,.doc,.docx">
                        <button class="btn btn-secondary" id="selectFileBtn">파일 선택</button>
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelAttachment">취소</button>
                    <button type="button" class="btn btn-primary" id="uploadFiles" disabled>
                        <span class="btn-text">전송</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                            업로드 중...
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 참여자 목록 사이드바 -->
        <aside class="members-sidebar" id="membersSidebar">
            <div class="sidebar-header">
                <h3>참여자 목록</h3>
                <button class="sidebar-close" id="closeMembersSidebar"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-content">
                <div class="members-list" id="membersList">
                    <!-- 참여자 목록이 여기에 동적으로 생성됩니다 -->
                </div>
            </div>
        </aside>

        <!-- 오버레이 -->
        <div class="overlay" id="overlay"></div>

        <!-- 토스트 메시지 -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- 히든 파일 입력 -->
    <input type="file" id="hiddenFileInput" style="display: none;" multiple>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/websocket-client.js"></script>
    <script src="/static/js/chat.js"></script>
</body>
</html>
