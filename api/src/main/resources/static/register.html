<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SimpleChatServer 회원가입">
    <title>회원가입 - SimpleChatServer</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo">
                        <span class="logo-icon">💬</span>
                        <span class="logo-text">SimpleChatServer</span>
                    </div>
                    <h1 class="auth-title">회원가입</h1>
                    <p class="auth-subtitle">새 계정을 만들어 채팅을 시작하세요</p>
                </div>

                <div class="auth-content">
                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label for="name" class="form-label">이름</label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                class="form-input"
                                placeholder="홍길동"
                                required
                                minlength="2"
                                maxlength="50"
                            >
                            <div class="form-error" id="nameError"></div>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">이메일</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input"
                                placeholder="example@email.com"
                                required
                            >
                            <div class="form-error" id="emailError"></div>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">비밀번호</label>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input"
                                placeholder="6자 이상의 안전한 비밀번호"
                                required
                                minlength="6"
                            >
                            <div class="form-error" id="passwordError"></div>
                            <div class="form-hint">영문, 숫자를 포함한 6자 이상</div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                class="form-input"
                                placeholder="비밀번호를 다시 입력하세요"
                                required
                            >
                            <div class="form-error" id="confirmPasswordError"></div>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                                <span class="checkbox-text">
                                    <a href="/terms" class="auth-link">이용약관</a> 및 
                                    <a href="/privacy" class="auth-link">개인정보처리방침</a>에 동의합니다
                                </span>
                            </label>
                            <div class="form-error" id="agreeTermsError"></div>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="agreeMarketing" name="agreeMarketing">
                                <span class="checkbox-text">마케팅 정보 수신에 동의합니다 (선택)</span>
                            </label>
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-primary btn-full" id="registerButton">
                                <span class="btn-text">회원가입</span>
                                <span class="btn-loading" style="display: none;">
                                    <span class="loading-spinner"></span>
                                    가입 중...
                                </span>
                            </button>
                        </div>

                        <div class="form-error" id="formError"></div>
                        <div class="form-success" id="formSuccess"></div>
                    </form>
                </div>

                <div class="auth-footer">
                    <p class="auth-switch">
                        이미 계정이 있으신가요? 
                        <a href="/login" class="auth-link">로그인</a>
                    </p>
                    <p class="auth-back">
                        <a href="/" class="auth-link">← 메인으로 돌아가기</a>
                    </p>
                </div>
            </div>

            <!-- 회원가입 안내 -->
            <div class="register-info">
                <h3>SimpleChatServer 회원가입</h3>
                <div class="info-section">
                    <div class="info-item">
                        <span class="info-icon">🔒</span>
                        <div class="info-content">
                            <strong>보안</strong>
                            <p>안전한 암호화를 통해 개인정보를 보호합니다</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">💬</span>
                        <div class="info-content">
                            <strong>실시간 채팅</strong>
                            <p>빠르고 안정적인 실시간 메시징 서비스</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">👥</span>
                        <div class="info-content">
                            <strong>그룹 채팅</strong>
                            <p>친구들과 함께 그룹 채팅방을 만들어보세요</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 회원가입 폼 초기화
            if (window.SimpleChatServer.register) {
                window.SimpleChatServer.register.setupRegisterForm();
            }
        });
    </script>
</body>
</html>
