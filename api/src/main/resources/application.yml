server:
  port: 8080

spring:
  application:
    name: simple-chat-server
  profiles:
    default: dev
  
  webflux:
    base-path: /api

  data:
    # MongoDB Configuration
    mongodb:
      uri: mongodb://simplechat:simplechat123@localhost:27017/simplechat
    
    # Redis Configuration
    redis:
      host: localhost
      port: 6379
      password: simplechat123
      timeout: 2000ms
    
  # R2DBC Configuration (PostgreSQL)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/simplechatserver
    username: simplechat
    password: simplechat123
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

# Logging Configuration
logging:
  level:
    com.simplechat: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# WebSocket Configuration
websocket:
  endpoint: /ws
  allowed-origins: "*"
  
# JWT Configuration
jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnly1234567890}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  issuer: simple-chat-server
  header: Authorization
  prefix: Bearer

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized