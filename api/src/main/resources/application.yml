server:
  port: 8080

spring:
  application:
    name: simple-chat-server
  profiles:
    default: dev
  
  webflux:
    base-path: /

  data:
    # MongoDB Configuration
    mongodb:
      uri: mongodb://simplechat:simplechat123@localhost:27017/simplechatserver?authSource=admin&maxPoolSize=20&minPoolSize=5&maxIdleTimeMS=300000&connectTimeoutMS=10000&socketTimeoutMS=30000
    
    # Redis Configuration
    redis:
      host: localhost
      port: 6379
      password: simplechat123
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms
    
  # R2DBC Configuration (PostgreSQL)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/simplechatserver
    username: simplechat
    password: simplechat123
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1
  
  # SQL Initialization Configuration
  sql:
    init:
      mode: never

# Logging Configuration
logging:
  level:
    com.simplechat: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# WebSocket Configuration
websocket:
  endpoint: /ws
  allowed-origins: "*"
  session:
    cleanup:
      enabled: true

# Message Broker Configuration
message-broker:
  monitoring:
    enabled: true
  performance:
    max-sessions: 10000
    max-subscriptions: 50000
    memory-threshold: 80
  
# JWT Configuration
jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnly1234567890}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  issuer: simple-chat-server
  header: Authorization
  prefix: Bearer

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  webflux:
    use-root-path: true

# 중복 로그인 제어 설정 (application.yml에 추가)
simplechat:
  security:
    duplicate-login:
      # 중복 로그인 제어 활성화
      enabled: true

      # 중복 로그인 감지 시 동작 방식
      # NOTIFY_ONLY: 알림만 전송
      # FORCE_LOGOUT_OTHERS: 기존 세션들 강제 로그아웃
      # DENY_NEW_LOGIN: 새로운 로그인 시도 거부
      # ASK_USER_CHOICE: 사용자에게 선택권 제공
      action: DENY_NEW_LOGIN

      # 최대 동시 세션 수 (0 = 무제한)
      max-concurrent-sessions: 1

      # 중복 로그인 알림 유효 기간 (초)
      notification-timeout-seconds: 300

      # 강제 로그아웃 시 유예 시간 (초)
      logout-grace-period-seconds: 10

      # 동일 IP 주소에서의 중복 로그인 허용 여부
      allow-same-ip-login: true

      # 관리자는 중복 로그인 제한 제외 여부
      exclude-admin-users: true

      # 세션 만료 시간 (초) - 비활성 세션 정리용
      session-timeout-seconds: 1800

      # 로그인 이력 보관 기간 (일)
      login-history-retention-days: 30