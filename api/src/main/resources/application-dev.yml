spring:
  data:
    # MongoDB Configuration for Development
    mongodb:
      uri: mongodb://simplechat:simplechat123@localhost:27017/simplechatserver?authSource=admin&maxPoolSize=20&minPoolSize=5&maxIdleTimeMS=300000&connectTimeoutMS=10000&socketTimeoutMS=30000

    # Redis Configuration for Development
    redis:
      host: localhost
      port: 6379
      password: simplechat123
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2
        shutdown-timeout: 100ms
        # 개발 환경용 Lettuce 설정
        client-name: "simple-chat-dev"

  # R2DBC Configuration for Development (PostgreSQL)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/simplechatserver
    username: simplechat
    password: simplechat123
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  # SQL 초기화 설정 (개발환경용)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
      separator: ;
      continue-on-error: false

# Logging Configuration for Development
logging:
  level:
    com.simplechat: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.postgresql: DEBUG
    io.lettuce.core: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# JWT Configuration for Development
jwt:
  secret: ${JWT_SECRET:devSecretKeyForDevelopmentEnvironment123456789}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  issuer: simple-chat-server-dev
  header: Authorization
  prefix: Bearer

# WebSocket Configuration for Development
websocket:
  endpoint: /ws
  allowed-origins: "http://localhost:3000,http://localhost:8080"

# 중복 로그인 설정 - 개발용
duplicate-login:
  enabled: true
  action: DENY_NEW_LOGIN  # 새로운 로그인 거부
  max-concurrent-sessions: 1

# Development specific settings
server:
  error:
    include-stacktrace: always
    include-message: always
