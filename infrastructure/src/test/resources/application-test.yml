spring:
  # R2DBC Configuration for Testing
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/simplechatserver
    username: simplechat
    password: simplechat123
    pool:
      initial-size: 1
      max-size: 5
      max-idle-time: 30m
      validation-query: SELECT 1

  # SQL 초기화 설정 (테스트환경용)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
      separator: ;
      continue-on-error: false

# Logging Configuration for Testing
logging:
  level:
    com.simplechat: DEBUG
    org.springframework.r2dbc: DEBUG